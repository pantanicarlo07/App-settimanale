<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Routine"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><title>Routine — Settimana</title></head><body><div class="app-shell"><header class="topbar"><div><span class="eyebrow">SETTIMANA</span><h1>La tua routine</h1></div><button id="addTop" class="icon-btn" aria-label="Aggiungi attività">＋</button></header><main><section class="day-strip" id="dayStrip"></section><section class="hero-card"><div><div class="eyebrow">GIORNO SELEZIONATO</div><h2 id="selectedDayTitle">Lunedì</h2><p id="daySummary">0 attività pianificate</p></div><div class="progress-ring"><span id="dayPercent">0%</span></div></section><section class="section-head"><h3>Programma</h3><button id="addInline" class="text-btn">Aggiungi</button></section><section id="timeline" class="timeline"></section><section class="section-head stats-head"><h3>Statistiche</h3></section><section class="stats-grid"><div class="stat"><span>Completate</span><strong id="doneCount">0</strong></div><div class="stat"><span>Tempo fatto</span><strong id="doneTime">0m</strong></div><div class="stat"><span>Tempo pianificato</span><strong id="plannedTime">0m</strong></div><div class="stat"><span>Percentuale</span><strong id="weekPercent">0%</strong></div></section></main></div><div id="modal" class="modal hidden"><div class="sheet"><div class="sheet-head"><h3 id="modalTitle">Nuova attività</h3><button id="closeModal" class="icon-btn">×</button></div><form id="routineForm"><input type="hidden" id="editId"><label>Titolo<input id="title" required maxlength="80" placeholder="Es. Allenamento"></label><label>Note<textarea id="notes" rows="3" placeholder="Dettagli opzionali"></textarea></label><div class="two"><label>Inizio<input id="start" type="time"></label><label>Fine<input id="end" type="time"></label></div><div class="two"><label>Categoria<select id="category"><option>Personale</option><option>Lavoro</option><option>Studio</option><option>Sport & Fitness</option><option>Salute & Relax</option><option>Casa & Famiglia</option><option>Hobby & Svago</option></select></label><label>Priorità<select id="priority"><option>Bassa</option><option selected>Media</option><option>Alta</option></select></label></div><div class="form-actions"><button type="button" id="deleteBtn" class="danger hidden">Elimina</button><button class="primary" type="submit">Salva</button></div></form></div></div><script src="./app.js"></script></body></html>
